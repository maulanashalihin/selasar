name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DO_NOT_SNAPSHOT: 1
          CLICKHOUSE_PASSWORD: test
        options: --health-cmd "clickhouse-client --password test --query 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DB: analytics
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run ch:init
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
