name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        ports:
          - 8123:8123
        options: --health-cmd "wget --spider -q http://localhost:8123/ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_DB: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ch:init
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
