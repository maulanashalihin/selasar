version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      svelte:
        patterns:
          - "svelte"
          - "@inertiajs/svelte"
          - "@inertiajs/core"
      hono:
        patterns:
          - "hono"
      dev:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "tailwindcss"
          - "@tailwindcss/cli"
          - "svelte-check"
      typebox:
        patterns:
          - "@sinclair/typebox"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
